# Veröffentlicht die Seite bei jedem Push auf main über GitHub Pages.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen (ohne Quell- und Konfigurationsdateien)
        run: |
          mkdir _site
          rsync -a --exclude '_site' --exclude '_source' --exclude '.git' --exclude '.github' --exclude '.claude' --exclude 'README.md' --exclude '.gitignore' ./ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
